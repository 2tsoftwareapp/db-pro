name: CI

# Main-branch pushes are verified locally (fmt/clippy/test). CI runs on PRs and manual dispatch only.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbpro
          POSTGRES_PASSWORD: dbpro_test
          POSTGRES_DB: dbpro_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://dbpro:dbpro_test@localhost:5432/dbpro_fixture
      DATA_DIFF_TARGET_DATABASE: dbpro_fixture_diff
      PGDATABASE: dbpro_fixture
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: dbpro
      PGPASSWORD: dbpro_test

    steps:
      - uses: actions/checkout@v4

      - name: Release version regressions
        run: python3 -m unittest discover -s scripts/release/tests -v

      # egui/eframe (crates/ui, crates/native-app) needs GL/X11/Wayland headers,
      # and libdbus-1-dev/pkg-config for keyring/dbus-secret-service compilation in tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config ripgrep

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Load PostgreSQL fixtures
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/001_schema.sql
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/002_seed.sql
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d dbpro_fixture -f fixtures/postgres/003_verify.sql
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'dbpro_fixture_diff'" | grep -q 1 || \
          PGPASSWORD=dbpro_test psql -v ON_ERROR_STOP=1 -h localhost -U dbpro -d postgres \
            -c "CREATE DATABASE dbpro_fixture_diff"

      - name: Configure live SSH backup fixture
        run: |
          ssh_dir="$RUNNER_TEMP/db-pro-ssh"
          ssh_user="$(whoami)"
          ssh_port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          mkdir -p "$ssh_dir" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/user_key"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_dir/host_key"
          cp "$ssh_dir/user_key.pub" "$ssh_dir/authorized_keys"
          chmod 600 "$ssh_dir/user_key" "$ssh_dir/authorized_keys"
          /usr/sbin/sshd -D -e -f /dev/null -p "$ssh_port" -h "$ssh_dir/host_key" \
            -o "AuthorizedKeysFile=$ssh_dir/authorized_keys" \
            -o StrictModes=no -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o PubkeyAuthentication=yes \
            -o UsePAM=no -o PermitRootLogin=no -o "AllowUsers=$ssh_user" \
            -o "PidFile=$ssh_dir/sshd.pid" >"$ssh_dir/sshd.log" 2>&1 &
          sshd_pid=$!
          echo "DB_PRO_SSHD_PID=$sshd_pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do
            if nc -z 127.0.0.1 "$ssh_port" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$sshd_pid" 2>/dev/null; then
              sed -n '1,120p' "$ssh_dir/sshd.log"
              exit 1
            fi
            sleep 0.1
          done
          nc -z 127.0.0.1 "$ssh_port"
          ssh-keyscan -p "$ssh_port" 127.0.0.1 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          {
            echo "DB_PRO_SSH_HOST=127.0.0.1"
            echo "DB_PRO_SSH_PORT=$ssh_port"
            echo "DB_PRO_SSH_USER=$ssh_user"
            echo "DB_PRO_SSH_KEY=$ssh_dir/user_key"
            echo "DB_PRO_SSH_TARGET_HOST=127.0.0.1"
            echo "DB_PRO_SSH_TARGET_PORT=5432"
            echo "DB_PRO_SSH_DATABASE=dbpro_fixture"
            echo "DB_PRO_SSH_USERNAME=dbpro"
            echo "DB_PRO_SSH_PASSWORD=dbpro_test"
          } >> "$GITHUB_ENV"

      - name: Clean code scan
        run: bash .skills/clean-code/scripts/clean-code-scan.sh rust --diff --ratchet --ci

      - name: Clean code ratchet (repo-wide)
        # --diff only sees changed files and --ratchet demotes pre-existing size
        # debt in those files to warnings, so a legacy function that grows past
        # the hard limit inside a touched file passes above. This step scans the
        # whole repo and fails on any error not frozen in
        # .clean-code-baseline.json (legacy debt accepted 2026-10-26).
        run: python3 tools/cc-scan.py . --fail-on error

      - name: Native UI architecture boundary
        run: bash scripts/check-ui-architecture.sh

      - name: Nightly rustfmt
        # rustfmt.toml uses unstable options (imports_granularity,
        # group_imports) — the fmt gate below runs on nightly.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo +nightly fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all -- -D warnings

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test --all -- --include-ignored

      - name: Stop live SSH backup fixture
        if: always()
        run: kill "${DB_PRO_SSHD_PID:-}" 2>/dev/null || true

      - name: cargo build native app (release)
        run: cargo build --release --locked -p db-pro-native

  macos-compile:
    name: macos-compile
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: cargo build db-pro-native
        run: cargo build --locked -p db-pro-native --all-targets

